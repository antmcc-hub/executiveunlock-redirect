name: Weekly security scan

on:
  schedule:
    - cron: "0 15 * * 6" # Sunday 02:00 AEDT / 01:00 AEST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # schedule/dispatch makes the pinned action scan all fetched history.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Remove local redacted report
        if: always()
        run: rm -f results.sarif

  dependencies:
    # Independent job: gitleaks findings must not skip the dependency scan.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify scanner failure and cleanup fixtures
        run: python3 -m unittest discover -s tests -p test_security_osv_scan.py
      - name: Scan the repository with checksum-pinned OSV-Scanner
        run: python3 .github/scripts/osv_scan.py
